const navy = new THREE.MeshPhysicalMaterial({color: '#012842', roughness: .22, clearcoat: 1, clearcoatRoughness: .1});
const orange = new THREE.MeshPhysicalMaterial({color: '#F0682F', roughness: .3, clearcoat: .8, clearcoatRoughness: .2});
const whiteP = new THREE.MeshPhysicalMaterial({color: '#FFFFFF', roughness: .25, clearcoat: .7, clearcoatRoughness: .15});
const bodyM = new THREE.MeshPhysicalMaterial({map: bodyTex, roughness: .22, clearcoat: .9, clearcoatRoughness: .12});
const r = PR;
lathe([[0, 0], [.0011, .0002], [.0019, .0009], [.0024, .0021], [.0026, .0045], [.0026, .0075]], felt);                       // felt bullet tip
lathe([[.0026, .0072], [.0032, .0078], [.0046, .0105], [.006, .0145], [.0071, .0185], [.0076, .021]], navy);                 // nose cone
lathe([[.0076, .0208], [.0079, .0212], [.0079, .0262], [.0076, .0266]], orange);                                          // collar
const bodyPts = []; for (let k = 0; k <= 24; k++) { const t = k / 24; bodyPts.push([r * (1 + .025 * Math.sin(Math.PI * t)), .0264 + t * .092]); }
lathe(bodyPts, bodyM);
lathe([[.0080, .1182], [.0083, .1186], [.0084, .1205], [.0084, .1395], [.0080, .1425], [.0068, .1448], [.0045, .1462], [0, .1466]], navy);  // cap
lathe([[.00845, .1215], [.0086, .1218], [.0086, .1232], [.00845, .1235]], orange);                                     // cap ring
// pocket clip on the cap
const clipS = new THREE.Shape(); clipS.moveTo(-.0018, 0); clipS.lineTo(.0018, 0); clipS.lineTo(.0016, .021); clipS.quadraticCurveTo(0, .0235, -.0016, .021); clipS.lineTo(-.0018, 0);
const clip = new THREE.Mesh(new THREE.ExtrudeGeometry(clipS, {depth: .0009, bevelEnabled: true, bevelThickness: .0003, bevelSize: .0003, bevelSegments: 3}), navy);
clip.position.set(0, .1205, .0088); pen.add(clip);
const clipFoot = new THREE.Mesh(new THREE.SphereGeometry(.0012, 16, 8), navy); clipFoot.position.set(0, .1225, .0098); pen.add(clipFoot);
pen.position.copy(penT); pen.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), penAx);
pen.rotateY(R(P.penSpin ?? 200)); scene.add(pen);

/* ================= cuff + sleeve fitted on the wrist ================= */
const wr = wp('wrist'), mc = wp('middle-finger-metacarpal'); const armDir = wr.clone().sub(mc).normalize();
let maxT = -1e9; for (let i = 0; i < gp.count; i++) { v.fromBufferAttribute(gp, i); maxT = Math.max(maxT, v.clone().sub(wr).dot(armDir)); }
const ring0 = []; for (let i = 0; i < gp.count; i++) { v.fromBufferAttribute(gp, i); if (v.clone().sub(wr).dot(armDir) > maxT - .012) ring0.push(v.clone()); }
const cen = ring0.reduce((a, b) => a.add(b), new THREE.Vector3()).multiplyScalar(1 / ring0.length);
const ax1 = new THREE.Vector3(1, 0, 0).sub(armDir.clone().multiplyScalar(armDir.x)).normalize(), ax2 = new THREE.Vector3().crossVectors(armDir, ax1);
let r1 = 0, r2 = 0; for (const p of ring0) { const d = p.clone().sub(cen); r1 = Math.max(r1, Math.abs(d.dot(ax1))); r2 = Math.max(r2, Math.abs(d.dot(ax2))); }
const arm = new THREE.Group(); scene.add(arm); arm.position.copy(cen.clone().addScaledVector(armDir, -.012)); arm.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(ax1, armDir, ax2));
const fab = document.createElement('canvas'); fab.width = fab.height = 256; const fx = fab.getContext('2d'); fx.fillStyle = '#808080'; fx.fillRect(0, 0, 256, 256);
for (let y = 0; y < 256; y += 2) { fx.fillStyle = `rgba(0,0,0,${.08 + Math.random() * .08})`; fx.fillRect(0, y, 256, 1); } for (let x = 0; x < 256; x += 3) { fx.fillStyle = `rgba(255,255,255,${Math.random() * .08})`; fx.fillRect(x, 0, 1, 256); }
const fabT = new THREE.CanvasTexture(fab); fabT.wrapS = fabT.wrapT = THREE.RepeatWrapping; fabT.repeat.set(24, 6);
const shirt = new THREE.MeshPhysicalMaterial({color: '#F7F9FB', roughness: .8, sheen: .8, sheenColor: new THREE.Color('#ffffff'), bumpMap: fabT, bumpScale: .4});
const cuffG = new THREE.CylinderGeometry(1, 1, .03, 96, 1, false); cuffG.translate(0, .015, 0);
const cuff = new THREE.Mesh(cuffG, shirt); cuff.scale.set(r1 + .006, 1, r2 + .006); arm.add(cuff);
for (const yy of [.002, .028]) { const e = new THREE.Mesh(new THREE.TorusGeometry(1, .045, 10, 96), shirt); e.rotation.x = Math.PI / 2; e.position.y = yy; e.scale.set(r1 + .006, r2 + .006, r1 + .006); arm.add(e); }
const btn = new THREE.Mesh(new THREE.CylinderGeometry(.0034, .0034, .0022, 32), orange); btn.position.set(r1 + .0068, .016, 0); btn.rotation.z = Math.PI / 2; arm.add(btn);
const suitT = fabT.clone(); suitT.repeat.set(40, 10);
const suit = new THREE.MeshPhysicalMaterial({color: '#0B2F4D', roughness: .9, sheen: 1, sheenColor: new THREE.Color('#2F5F8A'), sheenRoughness: .8, bumpMap: suitT, bumpScale: .6});
const SL = P.sleeveLen ?? .9; const slG = new THREE.CylinderGeometry(1, P.sleeveFlare ?? 1.12, SL, 96, 16, false); slG.translate(0, SL / 2 + .022, 0);
const sleeve = new THREE.Mesh(slG, suit); sleeve.scale.set(r1 + (P.sleeveR ?? .009), 1, r2 + (P.sleeveR ?? .009)); arm.add(sleeve);

/* ================= lights + camera ================= */
scene.add(new THREE.HemisphereLight('#FFF4EC', '#8FA8C0', .5));
const key = new THREE.DirectionalLight('#FFF1E4', P.key ?? 2.2); key.position.set(...(P.keyPos || [.7, .6, -.5])); scene.add(key);
const rim = new THREE.DirectionalLight('#D5E6FF', P.rim ?? 1.4); rim.position.set(...(P.rimPos || [-.5, -.5, .8])); scene.add(rim);
const fill = new THREE.DirectionalLight('#FFE0CC', .45); fill.position.set(.3, -.3, .9); scene.add(fill);
const cam = new THREE.PerspectiveCamera(P.fov ?? 22, 1, .001, 10);
const look = V(P.look || [0.03, -0.045, -0.02]);
cam.position.copy(V(P.camDir || [1, .35, -.45]).normalize().multiplyScalar(P.dist ?? .6).add(look)); cam.up.set(...(P.up || [0, -1, 0])); cam.lookAt(look);
renderer.render(scene, cam);
const tp = penT.clone().project(cam), bp = penT.clone().addScaledVector(penAx, .1).project(cam); window.TIP = {x: (tp.x + 1) / 2 * SIZE, y: (1 - tp.y) / 2 * SIZE, bx: (bp.x + 1) / 2 * SIZE, by: (1 - bp.y) / 2 * SIZE};
window.READY = true;
</script></body></html>
