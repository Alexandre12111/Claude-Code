<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>IP Box Leyton</title>
<style>
@font-face{font-family:Nohemi;font-weight:700;src:url(fonts/Nohemi-Bold.ttf)}
@font-face{font-family:Nohemi;font-weight:600;src:url(fonts/Nohemi-SemiBold.ttf)}
@font-face{font-family:Montserrat;font-weight:400;src:url(fonts/montserrat-latin-400-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
:root{--navy:#002C49;--orange:#F0682F;--accent-ink:#B8461B;--ink-2:#3B5266;--surface:#FFFFFF;--surface-2:#F4F7FA;--line:#D3DEE7;--sub-muted:#9FB3C4}
html,body{margin:0;padding:0;background:#002C49}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#002C49}
#board{position:absolute;left:0;top:0;width:11520px;height:2160px;transform-origin:0 0}
#art{position:absolute;left:0;top:0;width:11520px;height:2160px;overflow:visible}
.ln{stroke:var(--navy);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.lo{stroke:var(--orange);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.t-n{font-family:Nohemi;font-weight:700;fill:var(--navy)}
.t-o{font-family:Nohemi;font-weight:700;fill:var(--orange)}
.t-k{font-family:Montserrat;font-weight:700;fill:var(--accent-ink);letter-spacing:6px}
.t-oi{font-family:Montserrat;font-weight:700;fill:var(--accent-ink)}
text{font-variant-numeric:tabular-nums}
.t-m{font-family:Montserrat;font-weight:700;fill:var(--navy)}
.t-ms{font-family:Montserrat;font-weight:500;fill:var(--ink-2)}
#hand{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
#glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light}
#bokeh{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#bokeh i{position:absolute;border-radius:50%;display:block}
#sweep{position:absolute;top:-20%;bottom:-20%;width:520px;left:-900px;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:rotate(12deg)}
#tx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1500px 950px at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,18,32,.30) 100%)}
#grain{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;opacity:.05;mix-blend-mode:overlay}
#bug{position:absolute;right:64px;top:56px;width:168px}
#subs{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;pointer-events:none}
#subs .box{max-width:1640px;text-align:center;font-family:Montserrat;font-weight:600;font-size:38px;line-height:1.3;color:var(--sub-muted);
  background:rgba(0,44,73,.96);padding:14px 32px 16px;border-radius:16px;box-shadow:0 8px 24px rgba(0,20,40,.22);border-left:6px solid #F0682F}
#subs .w{transition:none}
#subs .on{color:#fff}
#subs .k.on{color:#FF9A6B}
#subs .k{color:#C98A6E}
#end{position:absolute;inset:0;opacity:0;overflow:hidden;background:radial-gradient(1200px 700px at 50% 42%,#0B4470 0%,#002C49 55%,#001A2D 100%);display:flex;flex-direction:column;align-items:center;justify-content:center}
#end .logo{width:780px;position:relative;overflow:hidden;padding:10px 0}
#end .tag{margin-top:44px;font-family:Nohemi;font-weight:700;font-size:62px;color:#fff;letter-spacing:.5px}
#end .tag em{font-style:normal;color:var(--orange)}
#end .rule{width:0;height:4px;background:var(--orange);margin:34px 0 28px;border-radius:2px}
#end .url{font-family:Montserrat;font-weight:600;font-size:34px;color:#C9D6E2;letter-spacing:3px}
#rays{position:absolute;left:50%;top:44%;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;opacity:.0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0deg 6deg,rgba(255,255,255,0) 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0%,transparent 60%)}
#shine{position:absolute;top:0;bottom:0;width:180px;left:-300px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);mix-blend-mode:overlay}
#endp{position:absolute;inset:0}
#prog{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:14px;font-family:Montserrat;font-weight:700;font-size:24px;color:#002C49;letter-spacing:2px}
#prog .seg{display:flex;gap:6px}#prog .seg i{display:block;width:34px;height:6px;border-radius:3px;background:#D3DEE7}#prog .seg i.on{background:#F0682F}#prog .seg i.done{background:#002C49}
</style>
</head>

      <linearGradient id="keyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0682F"/><stop offset="1" stop-color="#F0682F"/></linearGradient>
      <linearGradient id="liqG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0682F"/><stop offset="1" stop-color="#F0682F"/></linearGradient>
    </defs></svg></div>
  <div id="glow"></div>

</div>
<script>__OPENTYPE__</script>
<script>
const TL = __TIMELINE__;
const FONTB64 = __FONTS__;
const LOGO = `__LOGO__`;

const NS='http://www.w3.org/2000/svg';
const NAVY='#002C49', OR='#F0682F', LOR='#FDE4D8', MIST='#E5EBED', LBL='#D6E1EA', SH='#B9C9D7';
const W1=1920,H1=1080;
const NS_=TL.scenes.length;
const CELLS=[[0,0],[1,0],[2,0],[3,0],[4,0],[4,1],[3,1],[2,1],[1,1],[0,1],[5,0]];
const art=document.getElementById('art'), defs=document.getElementById('defs');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, esine=t=>-(Math.cos(Math.PI*t)-1)/2, eout=t=>1-Math.pow(1-t,3);
const eback=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eel=t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1;
let SEED=12345; const rnd=()=>{SEED=(SEED*16807)%2147483647;return (SEED-1)/2147483646};
function el(tag,attrs={},parent=null,text=null){const e=document.createElementNS(NS,tag);if((attrs.class==='ln'||attrs.class==='lo')&&!('fill' in attrs))attrs=Object.assign({fill:'none'},attrs);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==null)e.textContent=text;if(parent)parent.appendChild(e);return e}
const norm=w=>w.toLowerCase().replace(/[^\p{L}\p{N}'-]/gu,'');
function W(si,word,occ=1){let c=0;for(const w of TL.scenes[si].words){if(norm(w.w)===norm(word)){c++;if(c===occ)return w.t}}throw new Error('cue '+si+' '+word)}
const A=i=>TL.scenes[i].start;
const SHAKES=[];const shake=(t0,dur,amp)=>SHAKES.push({t0,dur,amp});
const SFX=[]; const sfx=(t,type,g=1)=>SFX.push({t,type,g,an:LAST});

/* ---------------- actions ---------------- */
const actions=[], anims=[];let LAST=null,LASTH=null;const S=a=>!a?0:(a.auto?(a.anchor?a.anchor.shift:0):a.shift);const apush=f=>{const an=LAST;anims.push(t=>f(t-S(an)))};
const geomLen=e=>{try{return e.getTotalLength()}catch(_){return 0}};
function boardPt(e,x,y){const m=e.getCTM();return {x:m.a*x+m.c*y+m.e,y:m.b*x+m.d*y+m.f}}
function prepFill(e){const f=e.getAttribute('fill');if(f&&f!=='none'){e.dataset.fill='1';e.style.fillOpacity=0}}
const SLOW=1.0;const softEase=t=>.8*t+.2*esine(t);
function draw(e,t0,dur,scene,ease=softEase,auto=false){
  dur*=SLOW;const L=geomLen(e); e.style.strokeDasharray=`${L+2} ${L+2}`; e.style.strokeDashoffset=L+2; prepFill(e);
  const N=Math.max(12,Math.min(600,Math.ceil(L/4)));const PX=new Float32Array(N+1),PY=new Float32Array(N+1),PL=new Float32Array(N+1);
  for(let k=0;k<=N;k++){const q=e.getPointAtLength(L*k/N);PX[k]=q.x;PY[k]=q.y;PL[k]=L*k/N}
  const sp=L/N, C=new Float32Array(N+1), J=new Uint8Array(N+1);
  for(let k=1;k<=N;k++){const ds=Math.hypot(PX[k]-PX[k-1],PY[k]-PY[k-1]);const jump=ds>sp*2.5+1;J[k]=jump?1:0;let c;
    if(jump)c=ds*.55+20; else {let dth=0;if(k>1&&!J[k-1]){const a1=Math.atan2(PY[k-1]-PY[k-2],PX[k-1]-PX[k-2]),a2=Math.atan2(PY[k]-PY[k-1],PX[k]-PX[k-1]);dth=Math.abs(Math.atan2(Math.sin(a2-a1),Math.cos(a2-a1)))}c=ds+42*dth}
    C[k]=C[k-1]+c}
  const CT=C[N]||1;
  const at=u=>{const tg=clamp(u)*CT;let lo=0,hi=N;while(hi-lo>1){const m=(lo+hi)>>1;if(C[m]<=tg)lo=m;else hi=m}const f=(tg-C[lo])/((C[hi]-C[lo])||1);
    return {x:lerp(PX[lo],PX[hi],f),y:lerp(PY[lo],PY[hi],f),l:J[hi]?PL[lo]:lerp(PL[lo],PL[hi],f),lift:J[hi]?Math.sin(Math.PI*f):0}};
  const a={kind:'path',e,t0,t1:t0+dur,L,scene,ease,auto:auto||L<(window.AUTO_MIN??175),at,
    pt(p){const r=at(p);const q=boardPt(e,r.x,r.y);q.lift=r.lift;return q},
    update(t){const r=at(this.ease(clamp((t-this.t0)/(this.t1-this.t0))));e.style.strokeDashoffset=(L+2)-r.l*(L+2)/L;if(e.dataset.fill)e.style.fillOpacity=clamp((t-this.t1)/.28)}};
  a.shift=0;a.anchor=a.auto?LASTH:null;if(!a.auto)LASTH=a;LAST=a;actions.push(a);return a;
}
function drawSeq(list,t0,dur,scene){const lens=list.map(e=>Math.max(geomLen(e),60)),tot=lens.reduce((a,b)=>a+b,0);let t=t0;list.forEach((e,i)=>{const d=dur*lens[i]/tot;draw(e,t,d,scene,softEase,i!==lens.indexOf(Math.max(...lens)));t+=d})}
const FONTS={};
function b64ab(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function fontFor(n){const cs=getComputedStyle(n);const w=+cs.fontWeight;if(/Nohemi/.test(cs.fontFamily))return FONTS.noh;return w>=800?FONTS.m800:w>=700?FONTS.m700:w>=600?FONTS.m600:FONTS.m500}
function glyphLayout(e){
  const size=+e.getAttribute('font-size');const ls=parseFloat(getComputedStyle(e).letterSpacing)||0;
  const segs=e.children.length?[...e.children]:[e];const items=segs.map(n=>({txt:n.textContent,f:fontFor(n),fill:getComputedStyle(n).fill}));
  const adv=(f,txt)=>{let w=0;const gs=f.stringToGlyphs(txt);gs.forEach((g,i)=>{w+=g.advanceWidth*size/f.unitsPerEm+ls;if(i<gs.length-1)w+=f.getKerningValue(g,gs[i+1])*size/f.unitsPerEm});return w};
  let total=items.reduce((a,it)=>a+adv(it.f,it.txt),0);const anc=e.getAttribute('text-anchor')||'start';let x=+e.getAttribute('x');const y=+e.getAttribute('y');
  if(anc==='middle')x-=total/2;else if(anc==='end')x-=total;
  const G=[];
  for(const it of items){const gs=it.f.stringToGlyphs(it.txt);gs.forEach((g,i)=>{const p=g.getPath(x,y,size);const bb=p.getBoundingBox();
      if(p.commands.length&&bb.x2>bb.x1){ // outer contour key points, starting top-left, for the pen loop
        const pts=[];for(const c of p.commands){if(c.type==='Z'){if(pts.length)break;continue}if(c.x!==undefined)pts.push([c.x,c.y])}
        const cx=(bb.x1+bb.x2)/2,cy=(bb.y1+bb.y2)/2;let k0=0,best=1e9;pts.forEach((q,k)=>{const v=q[0]-bb.x1+(q[1]-bb.y1)*.6;if(v<best){best=v;k0=k}});
        const loop=[];const n=Math.min(9,Math.max(4,Math.round(pts.length/2)));for(let k=0;k<n;k++){const q=pts[(k0+Math.floor(k*pts.length/n))%pts.length];loop.push([cx+(q[0]-cx)*.72,cy+(q[1]-cy)*.72])}
        G.push({d:p.toPathData(2),bb,fill:it.fill,loop,w:bb.x2-bb.x1})}
      x+=g.advanceWidth*size/it.f.unitsPerEm+ls;if(i<gs.length-1)x+=it.f.getKerningValue(g,gs[i+1])*size/it.f.unitsPerEm});}
  return G;
}
function write(e,t0,dur,scene,auto=false){
  dur*=SLOW;const bb=e.getBBox();const G=glyphLayout(e);e.style.visibility='hidden';
  const grp=el('g',{});e.parentNode.insertBefore(grp,e);
  const W=G.reduce((a,g)=>a+g.w+6,0)||1;let acc=0;const K=[];  // timeline of pen key points
  for(const g of G){const id='c'+Math.random().toString(36).slice(2);const cp=el('clipPath',{id,clipPathUnits:'userSpaceOnUse'},defs);
    g.rect=el('rect',{x:g.bb.x1-3,y:g.bb.y1-8,height:g.bb.y2-g.bb.y1+16,width:0},cp);
    g.el=el('path',{d:g.d,fill:g.fill,'clip-path':`url(#${id})`},grp);
    g.p0=acc/W;acc+=g.w+6;g.p1=acc/W;
    g.loop.forEach((q,k)=>K.push({p:g.p0+(g.p1-g.p0)*(k+.5)/g.loop.length,x:q[0],y:q[1],g}));}
  if(!K.length)K.push({p:0,x:bb.x,y:bb.y+bb.height*.6},{p:1,x:bb.x+bb.width,y:bb.y+bb.height*.6});
  const cr=(a,b,c,d,t)=>.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
  const at=p=>{p=clamp(p);let i=0;while(i<K.length-1&&K[i+1].p<p)i++;if(p<=K[0].p)return {x:K[0].x,y:K[0].y};if(i>=K.length-1)return {x:K[K.length-1].x,y:K[K.length-1].y};
    const a=K[Math.max(0,i-1)],b=K[i],c=K[i+1],d=K[Math.min(K.length-1,i+2)];const t=(p-b.p)/((c.p-b.p)||1);return {x:cr(a.x,b.x,c.x,d.x,t),y:cr(a.y,b.y,c.y,d.y,t)}};
  const a={kind:'text',e,t0,t1:t0+dur,scene,
    pt(p){const q=at(p);return boardPt(e,q.x,q.y)},
    update(t){const p=clamp((t-this.t0)/(this.t1-this.t0));for(const g of G){const lp=clamp((p-g.p0)/(g.p1-g.p0));
      // reveal follows the pen: left to right inside each letter, with a soft lead
      g.rect.setAttribute('width',(g.w+6)*Math.min(1,lp*1.08))}}};
  a.shift=0;if(auto){a.auto=true;a.anchor=LASTH}else{a.auto=false;LASTH=a}LAST=a;actions.push(a);return a;
}
const drawA=(e,t0,dur,scene)=>draw(e,t0,dur,scene,softEase,true), writeA=(e,t0,dur,scene)=>write(e,t0,dur,scene,true);
function drawSeqA(list,t0,dur,scene){const lens=list.map(e=>Math.max(geomLen(e),60)),tot=lens.reduce((a,b)=>a+b,0);let t=t0;list.forEach((e,i)=>{const d=dur*lens[i]/tot;drawA(e,t,d,scene);t+=d})}
function fade(e,t0,dur){e.style.opacity=0;apush(t=>{e.style.opacity=clamp((t-t0)/dur)})}
function centerOf(e){const bb=e.getBBox();return [bb.x+bb.width/2,bb.y+bb.height/2]}
function pop(e,t0,dur=.38,snd=true){const [cx,cy]=centerOf(e);const base=e.getAttribute('transform')||'';e.style.opacity=0;if(snd)sfx(t0,'pop',.6);
  apush(t=>{const p=clamp((t-t0)/dur);const s=p<=0?0.0001:eback(p);e.style.opacity=p>0?1:0;e.setAttribute('transform',`${base} translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`)})}
function move(e,t0,dur,dx,dy,ease=eio){const base=e.getAttribute('transform')||'';apush(t=>{const p=ease(clamp((t-t0)/dur));e.setAttribute('transform',`${base} translate(${dx*p} ${dy*p})`)})}
function spin(e,t0,cx,cy,speed){const base=e.getAttribute('transform')||'';apush(t=>{const r=t>t0?(t-t0)*speed:0;e.setAttribute('transform',`${base} rotate(${r} ${cx} ${cy})`)})}
function loop(t0,fn){apush(t=>fn(Math.max(0,t-t0),t>=t0))}
/* highlighter swipe behind a text */
function hilite(g,txt,t0,dur=.35,color='rgba(240,104,47,.22)'){const bb=txt.getBBox();const r=el('rect',{x:bb.x-14,y:bb.y+bb.height*.18,height:bb.height*.74,width:0,rx:8,fill:color});txt.parentNode.insertBefore(r,txt);sfx(t0,'swipe',.5);
  apush(t=>{r.setAttribute('width',(bb.width+28)*eout(clamp((t-t0)/dur)))})}
/* particles burst */
function burst(g,cx,cy,t0,n=22,R=170,cols=[OR,NAVY,'#FDE4D8',OR]){const parts=[];sfx(t0,'chime',.8);PULSES.push({t:t0,an:LAST});
  for(let k=0;k<n;k++){const a=rnd()*Math.PI*2,v=R*(.55+rnd()*.6),sz=5+rnd()*9,c=cols[k%cols.length],kind=k%3;
    const e=kind===0?el('circle',{r:sz/2,fill:c},g):kind===1?el('rect',{width:sz,height:sz*.45,rx:2,fill:c},g):el('path',{d:'M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z',fill:c},g);
    e.style.opacity=0;parts.push({e,a,v,rot:rnd()*360,vr:(rnd()-.5)*720,life:.75+rnd()*.5})}
  apush(t=>{const dt=t-t0;for(const p of parts){if(dt<0||dt>p.life){p.e.style.opacity=0;continue}const q=dt/p.life,d=eout(q)*p.v;

    const des=L.map(a=>a.t0),nat=L.map(a=>a.t1-a.t0);

    const tr=L.map((a,i)=>{if(!i)return 0;const p=endPt(L[i-1]),q=startPt(a);return clamp(.06+Math.hypot(p.x-q.x,p.y-q.y)/3000,.12,.4)});
    const floor=s===NS_?.3:A(s)+.12;const lo=i=>Math.max(floor,des[i]-ANT);
    const st=des.map((d,i)=>Math.max(lo(i),d-.15)),du=nat.map((d,i)=>Math.max(minD[i],Math.min(d,d)));
    for(let it=0;it<40;it++){
      for(let i=1;i<n;i++)st[i]=Math.max(st[i],st[i-1]+du[i-1]+tr[i]);
      for(let i=n-2;i>=0;i--){const lim=Math.min(st[i+1],Math.max(des[i+1],st[i+1]-.0))-tr[i+1]-du[i];const want=Math.min(st[i+1],des[i+1])-tr[i+1]-du[i];if(st[i]>want)st[i]=Math.max(lo(i),Math.min(st[i],want))}
      // still late: speed up the strokes just before (never faster than a real hand)
      for(let i=1;i<n;i++){const late=st[i]-des[i];if(late>.08){for(let j=i-1;j>=Math.max(0,i-3)&&st[i]-des[i]>.08;j--){const can=du[j]-minD[j];const take=Math.min(can,(st[i]-des[i])*.5);du[j]-=take;st[i]-=take}}}
    }
    for(let i=1;i<n;i++)st[i]=Math.max(st[i],st[i-1]+du[i-1]+tr[i]);
    // idle before the next stroke: draw slower instead of waiting
    for(let i=0;i<n-1;i++){const spare=st[i+1]-tr[i+1]-(st[i]+du[i]);if(spare>0)du[i]+=Math.min(spare*.85,nat[i]*1.1)}
    L.forEach((a,i)=>{a.shift=st[i]-des[i];a.t0=st[i];a.t1=st[i]+du[i]});
    const last=Math.max(...L.map(a=>a.t1));OVER[s]=s===NS_?Math.max(0,last+.25-TW(0).T0):s<NS_-1?Math.max(0,last+.25-(A(s+1)-.5)):last;}
}

/* ---------------- overlays ---------------- */
const gctx=document.getElementById('grain').getContext('2d');const gimg=gctx.createImageData(640,360);
function grain(f){let s=(f*9301+49297)%233280||1;const d=gimg.data;for(let k=0;k<d.length;k+=4){s=(s*16807)%2147483647;const v=110+(s%37)*4;d[k]=d[k+1]=d[k+2]=v;d[k+3]=255}gctx.putImageData(gimg,0,0)}
function glowFx(t){document.getElementById('glow').style.background=`radial-gradient(900px 620px at ${300+200*Math.sin(t*.21)}px ${180+90*Math.cos(t*.17)}px, rgba(255,160,110,.55), rgba(255,160,110,0) 70%), radial-gradient(800px 600px at ${1650+120*Math.cos(t*.13)}px ${900+60*Math.sin(t*.19)}px, rgba(120,170,220,.45), rgba(120,170,220,0) 70%)`}
let TXG=null;const BOK=[];
function buildFx(){const s=document.getElementById('tx');TXG={
  disk:el('circle',{cx:960,cy:540,r:0,fill:'#002C49'},s),
  hole:el('path',{d:'',fill:'#002C49','fill-rule':'evenodd'},s),
  ring:el('circle',{cx:960,cy:540,r:0,fill:'none',stroke:OR,'stroke-width':28,'stroke-dasharray':'1 0'},s),
  logo:el('g',{opacity:0},s),
  brush:el('g',{},s),streaks:el('g',{},s),flash:el('rect',{x:0,y:0,width:1920,height:1080,fill:'#fff',opacity:0},s)};
  TXG.logo.innerHTML=LOGO.replaceAll('class="navy"','fill="#FFFFFF"').replaceAll('class="orange"','fill="#F0682F"').replace('<svg','<svg x="770" y="500" width="380" height="78"');
  const bp=[];for(let k=0;k<=24;k++){const y=-200+k*(1480/24);bp.push(`${(k%2?-60:0)+30*Math.sin(k*1.7)} ${y}`)}
  el('path',{d:`M -2600 -200 L 0 -200 L ${bp.join(' L ')} L -2600 1280 Z`,fill:'#002C49'},TXG.brush);
  el('path',{d:`M -40 -200 L ${bp.map(q=>{const [x,y]=q.split(' ');return (+x+150)+' '+y}).join(' L ')} L ${bp.slice().reverse().map(q=>{const [x,y]=q.split(' ');return (+x-40)+' '+y}).join(' L ')} Z`,fill:OR},TXG.brush);
  el('path',{d:`M -2640 -200 L ${bp.map(q=>{const [x,y]=q.split(' ');return (-2600-x*1+110)+' '+y}).join(' L ')} L -2600 1280 L -2640 1280 Z`,fill:OR},TXG.brush);
  TXG.brush.style.opacity=0;
  for(let k=0;k<16;k++){const r=el('rect',{x:0,y:40+k*66+rnd()*30,width:300+rnd()*700,height:3+rnd()*5,rx:3,fill:k%3?'#ffffff':OR,opacity:0},TXG.streaks);r.dataset.v=900+rnd()*900;r.dataset.o=rnd()*1920}
  const bk=document.getElementById('bokeh');for(let k=0;k<20;k++){const d=document.createElement('i');const sz=30+rnd()*140;const col=k%4===0?'240,104,47':'255,255,255';
    d.style.width=d.style.height=sz+'px';d.style.background=`radial-gradient(circle,rgba(${col},${(.10+rnd()*.12)*.45}) 0%,rgba(${col},0) 70%)`;bk.appendChild(d);BOK.push({d,x:rnd()*2400-240,y:rnd()*1300-110,z:.08+rnd()*.25,ph:rnd()*6})}}
function fxRender(t,cam){
  let tt=null,k0=0;for(let k=0;k<NS_;k++){const w=TW(k);if(t>=w.T0&&t<=w.T1){tt=TTYPE[k];k0=k}}
  const G=TXG;G.disk.setAttribute('r',0);G.hole.setAttribute('d','');G.ring.setAttribute('r',0);G.logo.setAttribute('opacity',0);G.brush.style.opacity=0;G.flash.setAttribute('opacity',0);
  for(const r of G.streaks.children)r.setAttribute('opacity',0);
  if(tt){const w=TW(k0);
    if(tt==='ring'){if(t<w.M){const p=eio(clamp((t-w.T0)/(w.M-w.T0)));const R_=p*1150;G.disk.setAttribute('r',R_);G.ring.setAttribute('r',R_);G.ring.setAttribute('stroke-dasharray',`${2*Math.PI*R_*.82} ${2*Math.PI*R_*.18}`);G.ring.setAttribute('transform',`rotate(${-60+140*p} 960 540)`)}
      else {const p=eout(clamp((t-w.M)/(w.T1-w.M)));const R_=p*1150;G.hole.setAttribute('d',`M 0 0 H 1920 V 1080 H 0 Z M ${960+R_} 540 A ${R_} ${R_} 0 1 0 ${960-R_} 540 A ${R_} ${R_} 0 1 0 ${960+R_} 540 Z`);G.ring.setAttribute('r',R_);G.ring.setAttribute('stroke-width',28*(1-p*.6));G.ring.setAttribute('stroke-dasharray',`${2*Math.PI*R_*.82} ${2*Math.PI*R_*.18}`);G.ring.setAttribute('transform',`rotate(${80+120*p} 960 540)`)}
      const lo=t<w.M?eio(clamp((t-(w.M-.28))/.24)):1-clamp((t-w.M)/.1);G.logo.setAttribute('opacity',lo);G.logo.setAttribute('transform',`translate(960 540) scale(${.9+.1*eout(clamp((t-(w.M-.28))/.3))}) translate(-960 -540)`);}
    if(tt==='brush'){const p=clamp((t-w.T0)/(w.T1-w.T0));const x=p<.5?lerp(-150,2600,eio(p*2)):lerp(2600,4900,eio((p-.5)*2));G.brush.style.opacity=1;G.brush.setAttribute('transform',`translate(${x} 0) skewX(-8)`)}
    if(tt==='whip'){const p=clamp((t-w.T0)/(w.T1-w.T0));const k=Math.sin(Math.PI*p);for(const r of G.streaks.children){const x=((+r.dataset.o+(t-w.T0)*(+r.dataset.v)*3)%2600)-400;r.setAttribute('x',x);r.setAttribute('opacity',k*.55)}
      G.flash.setAttribute('opacity',.22*Math.max(0,1-Math.abs(p-.5)/.12))}}
  for(const b of BOK){const px=((b.x-cam.x*b.z*.4+20*Math.sin(t*.3+b.ph))%2400+2400)%2400-240,py=((b.y-cam.y*b.z*.4+15*Math.cos(t*.27+b.ph))%1300+1300)%1300-110;b.d.style.transform=`translate(${px}px,${py}px)`}
  // light sweep at the start of every board
  let sw=-900;for(let k=-1;k<NS_;k++){const t0=(k>=0?TW(k).T1:0)+.15,p=(t-t0)/1.1;if(p>=0&&p<=1)sw=lerp(-900,2400,eio(p))}document.getElementById('sweep').style.left='-900px';
}
let endParts=[];
function buildEnd(){const s=document.getElementById('endp');for(let k=0;k<46;k++){const c=el('circle',{r:1.5+rnd()*3.5,fill:k%4===0?OR:'#FFFFFF'},s);endParts.push({c,x:rnd()*1920,y:rnd()*1080,v:10+rnd()*30,ph:rnd()*6,o:.15+rnd()*.5})}}

/* ---------------- init / render ---------------- */
async function init(){
  await Promise.all(['700 80px Nohemi','600 80px Nohemi','400 40px Montserrat','500 40px Montserrat','600 40px Montserrat','700 40px Montserrat','800 40px Montserrat'].map(f=>document.fonts.load(f,'AÉé€’')));
  await document.fonts.ready;
  for(const k in FONTB64)FONTS[k]=opentype.parse(b64ab(FONTB64[k]));
  [sceneIntro,scene0,scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9].map(f=>f()).forEach(b=>{LAST=null;LASTH=null;b()});
  KICKS.forEach((k,i)=>{LAST=null;if(k)fade(k,A(i)-.05,.4)});
  sequence();
  for(const a of actions)if(a.auto){const d=S(a);a.t0+=d;a.t1+=d}
  for(const e of SFX){e.t=+(e.t+S(e.an)).toFixed(3);delete e.an}
  for(const P of PULSES){P.t+=S(P.an);delete P.an}
  LAST=null;
  ZT0=Math.max(W(NS_-1,'dossier')+.6,OVER[NS_-1]+.35); ET0=ZT0+ZD+.4; window.OVER=OVER;window.SH=actions.filter(a=>!a.auto).map(a=>a.shift);window.DBG=[...Array(NS_).keys()].map(s=>{const L=actions.filter(a=>a.scene===s);return [L.length,+L.reduce((x,a)=>x+(a.t1-a.t0),0).toFixed(2),+(s<NS_-1?A(s+1)-A(s):9).toFixed(2)]}); window.END_T=ET0+.45+1.7;
  for(let k=0;k<NS_;k++)sfx(TW(k).T0+(TTYPE[k]==='whip'?0:.05),TTYPE[k],1); sfx(ZT0,'whoosh',1); sfx(ET0+.05,'logo',1);
  actions.sort((a,b)=>a.t0-b.t0);
  document.getElementById('hand').innerHTML='<img src="hand.png" style="position:absolute;left:-11.8px;top:-4.6px;width:807.5px">';HAND=document.getElementById('hand');
  await new Promise(r=>{const im=HAND.querySelector('img');if(im.complete)r();else im.onload=r});
  document.getElementById('bug').src='data:image/svg+xml;utf8,'+encodeURIComponent(LOGO.replaceAll('class="navy"','fill="#002C49"').replaceAll('class="orange"','fill="#F0682F"'));
  document.getElementById('endlogo').insertAdjacentHTML('afterbegin',LOGO.replaceAll('class="navy"','fill="#FFFFFF"').replace('class="orange"','id="ring" fill="#F0682F"'));
  buildEnd();buildFx();
  // precompute the hand path for every frame, then low-pass it so it never jerks
  {const N=Math.ceil(TL.total*30)+2;const raw=[];for(let f=0;f<N;f++){const t=f/30;raw.push(handTarget(t,camera(t)))}
   const g=(sig)=>{const k=[];const R_=Math.ceil(sig*3);for(let i=-R_;i<=R_;i++)k.push([i,Math.exp(-i*i/(2*sig*sig))]);return k};
   const KX=g(window.HSIG??2.6),KL=g(4),KS=g(window.DSIG??1.1);
   const D=raw.map(q=>q.draw?1:0);
   HPATH=raw.map((_,f)=>{let x=0,y=0,w=0,l=0,wl=0,dd=0;for(const [i,kw] of KX){const q=raw[Math.min(N-1,Math.max(0,f+i))];x+=q.x*kw;y+=q.y*kw;w+=kw;dd+=D[Math.min(N-1,Math.max(0,f+i))]*kw}
     for(const [i,kw] of KL){const q=raw[Math.min(N-1,Math.max(0,f+i))];l+=(q.lift??0)*kw;wl+=kw}
     const r=raw[f];let sx=0,sy=0,sw=0;for(const [i,kw] of KS){const q=raw[Math.min(N-1,Math.max(0,f+i))];sx+=q.x*kw;sy+=q.y*kw;sw+=kw}
     const k=clamp(1-dd/w);const fx=lerp(sx/sw,x/w,k),fy=lerp(sy/sw,y/w,k);return {x:fx,y:fy,lift:l/wl,draw:r.draw}});
   let ang=0,av=0;for(let f=0;f<HPATH.length;f++){const a_=HPATH[Math.max(0,f-1)],b_=HPATH[f];const vx=b_.x-a_.x,vy=b_.y-a_.y;const on=Math.abs(vx)<300&&Math.abs(vy)<300;
     const tg=on?clamp(-vx*.32,-7,7)+clamp(vy*.18,-4,4):0;const acc=(tg-ang)*.09-av*.42;av+=acc;ang+=av;HPATH[f].ang=ang;HPATH[f].spd=on?Math.hypot(vx,vy):0}}
  window.SFX=SFX.map(({an,...e})=>e).sort((a,b)=>a.t-b.t); window.READY=true;
}
let lastHand=null,lastCam=null;
function progress(t){let s=-1;for(let k=0;k<NS_;k++)if(t>=TW(k).M)s=k;const pr=document.getElementById('prog');
  pr.style.opacity=s<0?0:1-clamp((t-ZT0)/.3);document.getElementById('pnum').textContent=String(Math.max(0,s)+1).padStart(2,'0')+'/'+String(NS_).padStart(2,'0');
  [...pr.querySelectorAll('.seg i')].forEach((e,k)=>e.className=k<s?'done':k===s?'on':'')}
function render(t,frame=0){
  const cam=camera(t);
  const board=document.getElementById('board');
  let shx=0,shy=0;for(const S of SHAKES){const p=(t-S.t0)/S.dur;if(p>=0&&p<=1){const a=S.amp*(1-p);shx+=a*Math.sin(t*93);shy+=a*Math.cos(t*71)}}
  board.style.transform=`translate(960px,540px) rotate(${cam.r||0}deg) translate(-960px,-540px) translate(${960-cam.x*cam.s+shx}px,${540-cam.y*cam.s+shy}px) scale(${cam.s})`;
  const cp=camera(Math.max(0,t-1/30));const mv=Math.hypot((cam.x-cp.x)*cam.s,(cam.y-cp.y)*cam.s)+Math.abs(cam.s-cp.s)*900;
  let blur=clamp(mv/14,0,9);if(t<.7)blur=Math.max(blur,8*(1-eio(clamp(t/.7))));
  board.style.filter=blur>.3?`blur(${blur.toFixed(2)}px)`:'none';
  for(const a of actions)a.update(t);for(const f of anims)f(t);
  const h=HPATH?HPATH[Math.min(HPATH.length-1,Math.round(t*30))]:handTarget(t,cam);const lift=clamp(h.lift??0);
  const SHO={x:2450,y:1750};const armA=Math.atan2(SHO.y-h.y,SHO.x-h.x)-Math.atan2(SHO.y-560,SHO.x-1180);
  const trem={x:.7*Math.sin(t*23.1)+.4*Math.sin(t*37.7),y:.6*Math.cos(t*19.3)+.4*Math.sin(t*41.9)};
  const press=h.draw?clamp((h.spd||0)/14):0;const rot=armA*180/Math.PI*.55+(h.ang||0)+Math.sin(t*6.3)*.4*(1-lift)-2.5*lift, depth=1-.05*clamp((560-h.y)/560,-1,1), sc=depth*(1+.05*lift-.012*press);
  HAND.style.transform=`translate(${h.x+trem.x}px,${h.y+trem.y}px) rotate(${rot+(-17.95)}deg) scale(${sc})`;
  HAND.style.filter=`drop-shadow(${10+14*lift}px ${16+22*lift}px ${12+10*lift}px rgba(0,20,40,${.30-.08*lift}))`;
  let speed=0;if(lastHand&&h.draw&&lastHand.draw)speed=Math.hypot(h.x-lastHand.x,h.y-lastHand.y);lastHand=h;
  // karaoke subtitles
  let line=null;for(const s of [TL.intro,...TL.scenes])for(const l of s.subs)if(t>=l.start-.05&&t<l.end)line=l;
  const st=document.getElementById('subtxt');
  if(line){if(st.dataset.v!==line.text){st.dataset.v=line.text;st.innerHTML=line.text.split(' ').map(x=>`<span class="w${/IP|Box|CIR|R&D|10|25|15|%|150|000|Nexus|2025|Leyton/.test(x)?' k':''}">${x.replace('&','&amp;')}</span>`).join(' ')}
    const words=[...st.children];const tot=line.text.length;const p=clamp((t-line.start)/Math.max(.3,line.se-line.start));let acc=0;
    words.forEach(s=>{acc+=s.textContent.length+1;s.classList.toggle('on',(acc-s.textContent.length*.5)/tot<=p+.02)});
    const fi=clamp((t-line.start+.05)/.15);st.parentElement.style.opacity=1;st.style.transform=`translateY(${(1-eout(fi))*14}px)`;st.style.opacity=fi}
  else st.parentElement.style.opacity=0;
  grain(frame);fxRender(t,cam);progress(t);
  document.getElementById('bug').style.opacity=1-clamp((t-ZT0)/.3);
  const ep=clamp((t-ET0)/.45);const end=document.getElementById('end');end.style.opacity=eout(ep);
  const ring=document.getElementById('ring');if(ring){ring.style.transformBox='fill-box';ring.style.transformOrigin='50% 50%';ring.style.transform=`rotate(${-260*(1-eout(clamp((t-ET0)/1.2)))}deg)`}
  document.getElementById('endlogo').style.transform=`scale(${.88+.12*eout(clamp((t-ET0)/1.1))})`;
  document.getElementById('endrule').style.width=`${280*eout(clamp((t-ET0-.3)/.6))}px`;
  document.getElementById('rays').style.opacity=.9*clamp((t-ET0)/.8);document.getElementById('rays').style.transform=`rotate(${(t-ET0)*6}deg)`;
  document.getElementById('shine').style.left=`${lerp(-300,1100,clamp((t-ET0-.6)/.8))}px`;
  for(const p of endParts){const d=Math.max(0,t-ET0);p.c.setAttribute('cx',p.x+12*Math.sin(d+p.ph));p.c.setAttribute('cy',p.y-p.v*d);p.c.style.opacity=p.o*clamp(d/.6)}
  return {draw:h.draw,speed};
}
window.render=render;init();
</script>
