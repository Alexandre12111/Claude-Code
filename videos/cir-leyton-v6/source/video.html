<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CIR Leyton V2</title>
<style>
@font-face{font-family:Nohemi;font-weight:700;src:url(fonts/Nohemi-Bold.ttf)}
@font-face{font-family:Nohemi;font-weight:600;src:url(fonts/Nohemi-SemiBold.ttf)}
@font-face{font-family:Montserrat;font-weight:400;src:url(fonts/montserrat-latin-400-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
:root{--navy:#002C49;--orange:#F0682F}
html,body{margin:0;padding:0;background:#002C49}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#001F35}
#board{position:absolute;left:0;top:0;width:7680px;height:2160px;transform-origin:0 0}
#art{position:absolute;left:0;top:0;width:7680px;height:2160px;overflow:visible}
.ln{stroke:var(--navy);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.lo{stroke:var(--orange);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.t-n{font-family:Nohemi;font-weight:700;fill:var(--navy)}
.t-o{font-family:Nohemi;font-weight:700;fill:var(--orange)}
.t-m{font-family:Montserrat;font-weight:700;fill:var(--navy)}
.t-ms{font-family:Montserrat;font-weight:500;fill:#3B5266}
#hand{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
#glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1500px 950px at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,18,32,.30) 100%)}
#grain{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;opacity:.075;mix-blend-mode:overlay}
#bug{position:absolute;right:64px;top:56px;width:168px}
#subs{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;pointer-events:none}
#subs .box{max-width:1640px;text-align:center;font-family:Montserrat;font-weight:600;font-size:37px;line-height:1.3;color:rgba(255,255,255,.5);
  background:linear-gradient(180deg,rgba(0,52,86,.94),rgba(0,36,60,.94));padding:14px 32px 16px;border-radius:16px;box-shadow:0 10px 30px rgba(0,20,40,.28),inset 0 1px 0 rgba(255,255,255,.08);border-left:6px solid #F0682F}
#subs .w{transition:none}
#subs .on{color:#fff}
#subs .k.on{color:#FF9A6B}
#subs .k{color:rgba(255,154,107,.55)}
#end{position:absolute;inset:0;opacity:0;overflow:hidden;background:radial-gradient(1200px 700px at 50% 42%,#0B4470 0%,#002C49 55%,#001A2D 100%);display:flex;flex-direction:column;align-items:center;justify-content:center}
#end .logo{width:780px;position:relative;overflow:hidden;padding:10px 0}
#end .tag{margin-top:44px;font-family:Nohemi;font-weight:700;font-size:62px;color:#fff;letter-spacing:.5px}
#end .tag em{font-style:normal;color:var(--orange)}
#end .rule{width:0;height:4px;background:var(--orange);margin:34px 0 28px;border-radius:2px}
#end .url{font-family:Montserrat;font-weight:600;font-size:34px;color:#C9D6E2;letter-spacing:3px}
#rays{position:absolute;left:50%;top:44%;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;opacity:.0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0deg 6deg,rgba(255,255,255,0) 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0%,transparent 60%)}
#shine{position:absolute;top:0;bottom:0;width:180px;left:-300px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);mix-blend-mode:overlay}
#endp{position:absolute;inset:0}
</style>
</head>
<body>
<div id="stage">
  <div id="board"><svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7680 2160" width="7680" height="2160">
    <defs id="defs">
      <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#002C49" flood-opacity=".16"/></filter>
      <filter id="shs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#002C49" flood-opacity=".14"/></filter>
      <radialGradient id="glowO"><stop offset="0" stop-color="#FFB089" stop-opacity=".9"/><stop offset=".5" stop-color="#F0682F" stop-opacity=".25"/><stop offset="1" stop-color="#F0682F" stop-opacity="0"/></radialGradient>
      <linearGradient id="coinG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9566"/><stop offset=".55" stop-color="#F0682F"/><stop offset="1" stop-color="#C94C17"/></linearGradient>
      <linearGradient id="navyG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B4572"/><stop offset="1" stop-color="#002138"/></linearGradient>
      <linearGradient id="bluG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4ECF3"/><stop offset="1" stop-color="#C7D6E3"/></linearGradient>
      <linearGradient id="orG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9DE"/><stop offset="1" stop-color="#FCD2BE"/></linearGradient>
      <linearGradient id="keyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB089"/><stop offset=".45" stop-color="#F0682F"/><stop offset="1" stop-color="#B9451A"/></linearGradient>
      <linearGradient id="liqG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A55"/><stop offset="1" stop-color="#D9541D"/></linearGradient>
    </defs></svg></div>
  <div id="glow"></div>
  <div id="vignette"></div>
  <img id="bug" alt="">
  <div id="hand"></div>
  <div id="end">
    <div id="rays"></div><svg id="endp" width="1920" height="1080"></svg>
    <div class="logo" id="endlogo"><div id="shine"></div></div>
    <div class="rule" id="endrule"></div>
    <div class="tag">Crédit d’Impôt <em>Recherche</em></div>
    <div class="url">leyton.com</div>
  </div>
  <div id="subs"><div class="box" id="subtxt"></div></div>
  <canvas id="grain" width="640" height="360"></canvas>
</div>
<script>
const TL = __TIMELINE__;
const LOGO = `__LOGO__`;

const NS='http://www.w3.org/2000/svg';
const NAVY='#002C49', OR='#F0682F', LOR='#FDE4D8', MIST='#E5EBED', LBL='#D6E1EA', SH='#B9C9D7';
const W1=1920,H1=1080;
const CELLS=[[0,0],[1,0],[2,0],[3,0],[3,1],[2,1],[1,1],[0,1]];
const art=document.getElementById('art'), defs=document.getElementById('defs');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, esine=t=>-(Math.cos(Math.PI*t)-1)/2, eout=t=>1-Math.pow(1-t,3);
const eback=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eel=t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1;
let SEED=12345; const rnd=()=>{SEED=(SEED*16807)%2147483647;return (SEED-1)/2147483646};
function el(tag,attrs={},parent=null,text=null){const e=document.createElementNS(NS,tag);if((attrs.class==='ln'||attrs.class==='lo')&&!('fill' in attrs))attrs=Object.assign({fill:'none'},attrs);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==null)e.textContent=text;if(parent)parent.appendChild(e);return e}
const norm=w=>w.toLowerCase().replace(/[^\p{L}\p{N}'-]/gu,'');
function W(si,word,occ=1){let c=0;for(const w of TL.scenes[si].words){if(norm(w.w)===norm(word)){c++;if(c===occ)return w.t}}throw new Error('cue '+si+' '+word)}
const A=i=>TL.scenes[i].start;
const SHAKES=[];const shake=(t0,dur,amp)=>SHAKES.push({t0,dur,amp});
const SFX=[]; const sfx=(t,type,g=1)=>SFX.push({t,type,g,an:LAST});

/* ---------------- actions ---------------- */
const actions=[], anims=[];let LAST=null,LASTH=null;const S=a=>!a?0:(a.auto?(a.anchor?a.anchor.shift:0):a.shift);const apush=f=>{const an=LAST;anims.push(t=>f(t-S(an)))};
const geomLen=e=>{try{return e.getTotalLength()}catch(_){return 0}};
function boardPt(e,x,y){const m=e.getCTM();return {x:m.a*x+m.c*y+m.e,y:m.b*x+m.d*y+m.f}}
function prepFill(e){const f=e.getAttribute('fill');if(f&&f!=='none'){e.dataset.fill='1';e.style.fillOpacity=0}}
const SLOW=1.0;const softEase=t=>.8*t+.2*esine(t);
function draw(e,t0,dur,scene,ease=softEase,auto=false){
  dur*=SLOW;const L=geomLen(e); e.style.strokeDasharray=`${L+2} ${L+2}`; e.style.strokeDashoffset=L+2; prepFill(e);
  const a={kind:'path',e,t0,t1:t0+dur,L,scene,ease,auto:auto||L<(window.AUTO_MIN??175),pt(p){const q=e.getPointAtLength(L*p);return boardPt(e,q.x,q.y)},
    update(t){const p=this.ease(clamp((t-this.t0)/(this.t1-this.t0)));e.style.strokeDashoffset=(L+2)*(1-p);if(e.dataset.fill)e.style.fillOpacity=clamp((t-this.t1)/.28)}};
  a.shift=0;a.anchor=a.auto?LASTH:null;if(!a.auto)LASTH=a;LAST=a;actions.push(a);return a;
}
function drawSeq(list,t0,dur,scene){const lens=list.map(e=>Math.max(geomLen(e),60)),tot=lens.reduce((a,b)=>a+b,0);let t=t0;list.forEach((e,i)=>{const d=dur*lens[i]/tot;draw(e,t,d,scene,softEase,i!==lens.indexOf(Math.max(...lens)));t+=d})}
function write(e,t0,dur,scene){
  dur*=SLOW;const bb=e.getBBox(); const id='c'+Math.random().toString(36).slice(2);
  const cp=el('clipPath',{id,clipPathUnits:'userSpaceOnUse'},defs); const r=el('rect',{x:bb.x-14,y:bb.y-40,height:bb.height+80,width:0},cp);
  e.setAttribute('clip-path',`url(#${id})`);
  const a={kind:'text',e,t0,t1:t0+dur,scene,
    pt(p,t=0){return boardPt(e,bb.x+bb.width*p,bb.y+bb.height*(.6+.07*Math.sin(t*20)))},
    update(t){const p=clamp((t-this.t0)/(this.t1-this.t0));r.setAttribute('width',(bb.width+28)*p+(p>0?8:0))}};
  a.shift=0;a.auto=false;LASTH=a;LAST=a;actions.push(a);return a;
}
function fade(e,t0,dur){e.style.opacity=0;apush(t=>{e.style.opacity=clamp((t-t0)/dur)})}
function centerOf(e){const bb=e.getBBox();return [bb.x+bb.width/2,bb.y+bb.height/2]}
function pop(e,t0,dur=.38,snd=true){const [cx,cy]=centerOf(e);const base=e.getAttribute('transform')||'';e.style.opacity=0;if(snd)sfx(t0,'pop',.6);
  apush(t=>{const p=clamp((t-t0)/dur);const s=p<=0?0.0001:eback(p);e.style.opacity=p>0?1:0;e.setAttribute('transform',`${base} translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`)})}
function move(e,t0,dur,dx,dy,ease=eio){const base=e.getAttribute('transform')||'';apush(t=>{const p=ease(clamp((t-t0)/dur));e.setAttribute('transform',`${base} translate(${dx*p} ${dy*p})`)})}
function spin(e,t0,cx,cy,speed){const base=e.getAttribute('transform')||'';apush(t=>{const r=t>t0?(t-t0)*speed:0;e.setAttribute('transform',`${base} rotate(${r} ${cx} ${cy})`)})}
function loop(t0,fn){apush(t=>fn(Math.max(0,t-t0),t>=t0))}
/* highlighter swipe behind a text */
function hilite(g,txt,t0,dur=.35,color='rgba(240,104,47,.22)'){const bb=txt.getBBox();const r=el('rect',{x:bb.x-14,y:bb.y+bb.height*.18,height:bb.height*.74,width:0,rx:8,fill:color});txt.parentNode.insertBefore(r,txt);sfx(t0,'swipe',.5);
  apush(t=>{r.setAttribute('width',(bb.width+28)*eout(clamp((t-t0)/dur)))})}
/* particles burst */
function burst(g,cx,cy,t0,n=22,R=170,cols=[OR,NAVY,'#FF9A6B','#7FA7C9']){const parts=[];sfx(t0,'chime',.8);
  for(let k=0;k<n;k++){const a=rnd()*Math.PI*2,v=R*(.55+rnd()*.6),sz=5+rnd()*9,c=cols[k%cols.length],kind=k%3;
    const e=kind===0?el('circle',{r:sz/2,fill:c},g):kind===1?el('rect',{width:sz,height:sz*.45,rx:2,fill:c},g):el('path',{d:'M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z',fill:c},g);
    e.style.opacity=0;parts.push({e,a,v,rot:rnd()*360,vr:(rnd()-.5)*720,life:.75+rnd()*.5})}
  apush(t=>{const dt=t-t0;for(const p of parts){if(dt<0||dt>p.life){p.e.style.opacity=0;continue}const q=dt/p.life,d=eout(q)*p.v;
    const x=cx+Math.cos(p.a)*d,y=cy+Math.sin(p.a)*d+220*dt*dt;p.e.style.opacity=1-q*q;p.e.setAttribute('transform',`translate(${x} ${y}) rotate(${p.rot+p.vr*dt}) scale(${1-.4*q})`)}})}
function ripple(g,cx,cy,t0,r0=60,r1=230,col=OR){const c=el('circle',{cx,cy,r:r0,fill:'none',stroke:col,'stroke-width':6},g);c.style.opacity=0;
  apush(t=>{const p=(t-t0)/.8;if(p<0||p>1){c.style.opacity=0;return}c.setAttribute('r',lerp(r0,r1,eout(p)));c.style.opacity=.7*(1-p);c.setAttribute('stroke-width',8*(1-p)+1)})}
function twinkle(g,x,y,t0,s=1,period=1.6){const e=el('path',{d:'M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3 Z',fill:OR},g);e.style.opacity=0;const ph=rnd()*6;
  apush(t=>{if(t<t0){e.style.opacity=0;return}const k=.5+.5*Math.sin((t-t0)*2*Math.PI/period+ph);e.style.opacity=k*Math.min(1,(t-t0)*3);e.setAttribute('transform',`translate(${x} ${y}) scale(${s*(.5+.6*k)}) rotate(${(t-t0)*40})`)})}
function counter(txt,t0,dur,from,to,fmt){txt.style.opacity=0;const n=Math.max(4,Math.round(dur*14));for(let k=0;k<n;k++)sfx(t0+dur*k/n,'tick',.35);
  apush(t=>{if(t<t0){txt.style.opacity=0;return}txt.style.opacity=1;const p=eout(clamp((t-t0)/dur));txt.textContent=fmt(lerp(from,to,p))})}

/* ---------------- shapes ---------------- */
function panel(i){const [cx,cy]=CELLS[i];const g=el('g',{transform:`translate(${cx*W1} ${cy*H1})`},art);
  const id='pg'+i;const lg=el('linearGradient',{id,x1:0,y1:0,x2:.3,y2:1},defs);el('stop',{offset:0,'stop-color':'#E3EAF1'},lg);el('stop',{offset:1,'stop-color':'#FBFCFD'},lg);
  const cid='pc'+i;const cp=el('clipPath',{id:cid},defs);el('rect',{x:22,y:22,width:W1-44,height:H1-44,rx:34},cp);
  el('rect',{x:22,y:22,width:W1-44,height:H1-44,rx:34,fill:`url(#${id})`},g);
  const wm=el('g',{'clip-path':`url(#${cid})`},g);
  el('text',{x:-30,y:560,class:'t-n','font-size':640,style:'fill:#DCE4EC'},wm,String(i+1).padStart(2,'0'));
  // faint dotted grid for the "drawing board" feel
  const pid='dots'+i;const pat=el('pattern',{id:pid,width:48,height:48,patternUnits:'userSpaceOnUse'},defs);el('circle',{cx:24,cy:24,r:1.6,fill:'#C9D6E2'},pat);
  el('rect',{x:22,y:22,width:W1-44,height:H1-44,rx:34,fill:`url(#${pid})`,opacity:.55},g);
  return g}
const P=(g,d,cls='ln',extra={})=>el('path',Object.assign({d,class:cls},extra),g);
const T=(g,x,y,txt,cls,size,extra={})=>el('text',Object.assign({x,y,class:cls,'font-size':size,'text-anchor':'middle'},extra),g,txt);
const G=(g,extra={})=>el('g',extra,g);
function fit(t,maxW){const w=t.getBBox().width;if(w>maxW){const fs=parseFloat(t.getAttribute('font-size'));t.setAttribute('font-size',(fs*maxW/w).toFixed(1))}return t}
function gearPath(cx,cy,R,r,n){let d='';for(let k=0;k<n;k++){const a0=k/n*2*Math.PI,w=Math.PI/n;
  [[r,a0-w*.55],[R,a0-w*.32],[R,a0+w*.32],[r,a0+w*.55]].forEach(([rr,a],j)=>{d+=(k===0&&j===0?'M':'L')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)});
  const a2=a0+2*w-w*.55;d+=`A ${r} ${r} 0 0 1 ${(cx+r*Math.cos(a2)).toFixed(1)} ${(cy+r*Math.sin(a2)).toFixed(1)}`}return d+'Z'}
function starPath(cx,cy,R){let d='';for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?R*.45:R;d+=(k?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)}return d+'Z'}
function arrowHead(x,y,dx,dy,L=40){const n=Math.hypot(dx,dy),ux=-dx/n,uy=-dy/n,c=Math.cos(.5),s=Math.sin(.5);return `M ${x+L*(ux*c-uy*s)} ${y+L*(uy*c+ux*s)} L ${x} ${y} L ${x+L*(ux*c+uy*s)} ${y+L*(uy*c-ux*s)}`}
function coin(g,cx,cy,r=34){const c=G(g);el('circle',{cx,cy:cy+r*.12,r,fill:'#B9451A'},c);el('circle',{cx,cy,r,fill:'url(#coinG)',stroke:NAVY,'stroke-width':4},c);
  el('circle',{cx,cy,r:r*.74,fill:'none',stroke:'#FFC3A6','stroke-width':2.5,opacity:.8},c);T(c,cx,cy+r*.4,'€','t-n',r*1.15,{style:'fill:#fff'});return c}
function rrect(x,y,w,h,r){return `M ${x+r} ${y} L ${x+w-r} ${y} Q ${x+w} ${y} ${x+w} ${y+r} L ${x+w} ${y+h-r} Q ${x+w} ${y+h} ${x+w-r} ${y+h} L ${x+r} ${y+h} Q ${x} ${y+h} ${x} ${y+h-r} L ${x} ${y+r} Q ${x} ${y} ${x+r} ${y} Z`}
function badge(g,cx,cy,r){return el('circle',{cx,cy,r,class:'lo','stroke-width':7,fill:'#fff'},g)}

/* ================= SCENES ================= */
function scene0(){const i=0,g=panel(i),w=(x,o)=>W(i,x,o);
  // bulb with glow
  const glow=el('circle',{cx:250,cy:350,r:170,fill:'url(#glowO)'},g);glow.style.opacity=0;
  const ib=G(g,{filter:'url(#sh)'});
  const bulb=P(ib,'M 202 505 C 202 455 152 432 152 360 A 98 98 0 1 1 348 360 C 348 432 298 455 298 505 Z','ln',{fill:'url(#orG)'});
  const shine=P(ib,'M 196 330 Q 205 290 236 276','ln',{stroke:'#fff','stroke-width':9});
  const b1=P(ib,'M 210 540 L 290 540'),b2=P(ib,'M 220 572 L 280 572'),b3=P(ib,'M 235 604 L 265 604');
  const fil=P(ib,'M 218 430 L 234 385 L 250 430 L 266 385 L 282 430','lo',{'stroke-width':6});
  const rays=[-160,-125,-90,-55,-20].map(a=>{const r=a*Math.PI/180;return P(g,`M ${250+130*Math.cos(r)} ${350+130*Math.sin(r)} L ${250+168*Math.cos(r)} ${350+168*Math.sin(r)}`,'lo')});
  // flask with rising bubbles
  const ifl=G(g,{filter:'url(#sh)'});
  const liq=P(ifl,'M 480 505 L 640 505 L 663 555 Q 674 584 644 584 L 476 584 Q 446 584 457 555 Z','',{fill:'url(#liqG)',stroke:'none'});
  const fl=P(ifl,'M 525 255 L 525 375 L 445 555 Q 432 592 472 592 L 648 592 Q 688 592 675 555 L 595 375 L 595 255','ln');
  const rim=P(ifl,'M 508 255 L 612 255');
  const bubs=G(g);const BB=[];for(let k=0;k<7;k++)BB.push({e:el('circle',{r:5+rnd()*7,class:'lo','stroke-width':4,fill:'#fff'},bubs),x:520+rnd()*80,ph:rnd(),sp:.6+rnd()*.5});
  // gears
  const ig=G(g,{filter:'url(#sh)'});const gA=G(ig),gB=G(ig);
  const gear=P(gA,gearPath(860,430,112,88,9),'ln',{fill:'url(#bluG)'});const hole=el('circle',{cx:860,cy:430,r:32,class:'ln',fill:'#fff'},gA);
  const gear2=P(gB,gearPath(985,318,58,45,8),'lo',{fill:LOR});const hole2=el('circle',{cx:985,cy:318,r:16,class:'lo',fill:'#fff'},gB);
  const up1=P(g,'M 1062 290 L 1062 170','lo',{'stroke-width':9}),up2=P(g,'M 1030 202 L 1062 168 L 1094 202','lo',{'stroke-width':9});
  const l1=T(g,250,700,'Inventer','t-m',44),l2=T(g,560,700,'Tester','t-m',44),l3=T(g,880,700,'Améliorer','t-m',44);
  // State building

    // long wait: glide to a resting spot just beside the drawing, sway gently, then come back
    const Rs={x:(P0.x+P1.x)/2+230,y:(P0.y+P1.y)/2+190};const vm={x:(P1.x-P0.x),y:(P1.y-P0.y)};const nm=Math.hypot(vm.x,vm.y)||1;const vr={x:vm.x/nm,y:vm.y/nm};
    const tin=Math.min(.9,gap*.35),tout=Math.min(.9,gap*.35);const sway={x:6*Math.sin(t*1.3),y:5*Math.cos(t*1.1)};
    if(t-prev.t1<tin){const s=smooth5((t-prev.t1)/tin);const q=travel(P0,v0,Rs,{x:0,y:0},s);return {x:q.x+sway.x*s,y:q.y+sway.y*s,draw:false,lift:Math.min(1,s*1.4)}}
    if(next.t0-t<tout){const s=smooth5(1-(next.t0-t)/tout);const q=travel(Rs,{x:0,y:0},P1,v1,s);return {x:q.x+sway.x*(1-s),y:q.y+sway.y*(1-s),draw:false,lift:Math.min(1,(1-s)*1.4)}}
    return {x:Rs.x+sway.x,y:Rs.y+sway.y,draw:false,lift:1};
  }
  if(prev&&t-prev.t1<.85){const s=smooth5((t-prev.t1)/.85);const q=travel(toScreen(endPt(prev),cam),dirAt(prev,1),OFF,{x:.6,y:.8},s);return {x:q.x,y:q.y,draw:false,lift:Math.min(1,s*1.5)}}
  if(next&&next.t0-t<.85){const s=smooth5(1-(next.t0-t)/.85);const q=travel(OFF,{x:-.6,y:-.8},toScreen(startPt(next),cam),dirAt(next,0),s);return {x:q.x,y:q.y,draw:false,lift:Math.min(1,(1-s)*1.5)}}
  return {...OFF,draw:false,lift:1};
}
// sequencer: one hand, so strokes never overlap and always leave time for a calm move between them
const OVER=[];let HACT=[];
function sequence(){
  HACT=actions.filter(a=>!a.auto);
  for(let s=0;s<NS_;s++){const L=HACT.filter(a=>a.scene===s).sort((a,b)=>a.t0-b.t0);
    for(let i=0;i<L.length-1;i++){const a=L[i],n=L[i+1];
      const pe=endPt(a),ns=startPt(n);const d=Math.hypot(pe.x-ns.x,pe.y-ns.y);const tr=clamp(.04+d/3200,.08,.32);
      const dur=a.t1-a.t0;
      if(a.t1+tr>n.t0){ // behind the voice: draw this stroke faster
        const t1=n.t0-tr;if(t1-a.t0>=Math.max(.07,dur*.25)){a.t1=t1}else{a.t1=a.t0+Math.max(.07,dur*.25);const dt=a.t1+tr-n.t0;n.t0+=dt;n.t1+=dt;n.shift+=dt}
      }else{ // ahead of the voice: draw this stroke slower instead of waiting
        const spare=n.t0-tr-a.t1;a.t1+=Math.min(spare*.85,dur*1.2)}
    }
    const last=L.length?Math.max(...L.map(a=>a.t1)):0;OVER[s]=s<NS_-1?Math.max(0,last+.25-(A(s+1)-.45)):last;}
}

/* ---------------- overlays ---------------- */
const gctx=document.getElementById('grain').getContext('2d');const gimg=gctx.createImageData(640,360);
function grain(f){let s=(f*9301+49297)%233280||1;const d=gimg.data;for(let k=0;k<d.length;k+=4){s=(s*16807)%2147483647;const v=110+(s%37)*4;d[k]=d[k+1]=d[k+2]=v;d[k+3]=255}gctx.putImageData(gimg,0,0)}
function glowFx(t){document.getElementById('glow').style.background=`radial-gradient(900px 620px at ${300+200*Math.sin(t*.21)}px ${180+90*Math.cos(t*.17)}px, rgba(255,160,110,.55), rgba(255,160,110,0) 70%), radial-gradient(800px 600px at ${1650+120*Math.cos(t*.13)}px ${900+60*Math.sin(t*.19)}px, rgba(120,170,220,.45), rgba(120,170,220,0) 70%)`}
let endParts=[];
function buildEnd(){const s=document.getElementById('endp');for(let k=0;k<46;k++){const c=el('circle',{r:1.5+rnd()*3.5,fill:k%4===0?OR:'#FFFFFF'},s);endParts.push({c,x:rnd()*1920,y:rnd()*1080,v:10+rnd()*30,ph:rnd()*6,o:.15+rnd()*.5})}}

/* ---------------- init / render ---------------- */
async function init(){
  await Promise.all(['700 80px Nohemi','600 80px Nohemi','400 40px Montserrat','500 40px Montserrat','600 40px Montserrat','700 40px Montserrat','800 40px Montserrat'].map(f=>document.fonts.load(f,'AÉé€’')));
  await document.fonts.ready;
  [scene0,scene1,scene2,scene3,scene4,scene5,scene6,scene7].map(f=>f()).forEach(b=>{LAST=null;LASTH=null;b()});
  sequence();
  for(const a of actions)if(a.auto){const d=S(a);a.t0+=d;a.t1+=d}
  for(const e of SFX){e.t=+(e.t+S(e.an)).toFixed(3);delete e.an}
  LAST=null;
  ZT0=Math.max(W(7,'votre')+.05,OVER[7]+.35); ET0=ZT0+ZD+.4; window.OVER=OVER;window.SH=actions.filter(a=>!a.auto).map(a=>a.shift);window.DBG=[0,1,2,3,4,5,6,7].map(s=>{const L=actions.filter(a=>a.scene===s);return [L.length,+L.reduce((x,a)=>x+(a.t1-a.t0),0).toFixed(2),+(s<7?A(s+1)-A(s):9).toFixed(2)]}); window.END_T=ET0+.45+1.7;
  for(let k=1;k<NS_;k++)sfx(A(k)-.5,'whoosh',.8); sfx(ZT0,'whoosh',1); sfx(ET0+.05,'logo',1);
  actions.sort((a,b)=>a.t0-b.t0);
  document.getElementById('hand').innerHTML='<img src="hand.png" style="position:absolute;left:-11.8px;top:-4.6px;width:807.5px">';HAND=document.getElementById('hand');
  await new Promise(r=>{const im=HAND.querySelector('img');if(im.complete)r();else im.onload=r});
  document.getElementById('bug').src='data:image/svg+xml;utf8,'+encodeURIComponent(LOGO.replaceAll('class="navy"','fill="#002C49"').replaceAll('class="orange"','fill="#F0682F"'));
  document.getElementById('endlogo').insertAdjacentHTML('afterbegin',LOGO.replaceAll('class="navy"','fill="#FFFFFF"').replace('class="orange"','id="ring" fill="#F0682F"'));
  buildEnd();
  // precompute the hand path for every frame, then low-pass it so it never jerks
  {const N=Math.ceil(TL.total*30)+2;const raw=[];for(let f=0;f<N;f++){const t=f/30;raw.push(handTarget(t,camera(t)))}
   const g=(sig)=>{const k=[];const R_=Math.ceil(sig*3);for(let i=-R_;i<=R_;i++)k.push([i,Math.exp(-i*i/(2*sig*sig))]);return k};
   const KX=g(window.HSIG??2),KL=g(4);
   HPATH=raw.map((_,f)=>{let x=0,y=0,w=0,l=0,wl=0;for(const [i,kw] of KX){const q=raw[Math.min(N-1,Math.max(0,f+i))];x+=q.x*kw;y+=q.y*kw;w+=kw}
     for(const [i,kw] of KL){const q=raw[Math.min(N-1,Math.max(0,f+i))];l+=(q.lift??0)*kw;wl+=kw}return {x:x/w,y:y/w,lift:l/wl,draw:raw[f].draw}})}
  window.SFX=SFX.map(({an,...e})=>e).sort((a,b)=>a.t-b.t); window.READY=true;
}
let lastHand=null,lastCam=null;
function render(t,frame=0){
  const cam=camera(t);
  const board=document.getElementById('board');
  let shx=0,shy=0;for(const S of SHAKES){const p=(t-S.t0)/S.dur;if(p>=0&&p<=1){const a=S.amp*(1-p);shx+=a*Math.sin(t*93);shy+=a*Math.cos(t*71)}}
  board.style.transform=`translate(${960-cam.x*cam.s+shx}px,${540-cam.y*cam.s+shy}px) scale(${cam.s})`;
  const cp=camera(Math.max(0,t-1/30));const mv=Math.hypot((cam.x-cp.x)*cam.s,(cam.y-cp.y)*cam.s)+Math.abs(cam.s-cp.s)*900;
  let blur=clamp(mv/14,0,9);if(t<.7)blur=Math.max(blur,8*(1-eio(clamp(t/.7))));
  board.style.filter=blur>.3?`blur(${blur.toFixed(2)}px)`:'none';
  for(const a of actions)a.update(t);for(const f of anims)f(t);
  const h=HPATH?HPATH[Math.min(HPATH.length-1,Math.round(t*30))]:handTarget(t,cam);const lift=clamp(h.lift??0);
  const rot=(h.x-960)/960*5+Math.sin(t*9)*.8*(1-lift)-2*lift, sc=1.22*(1+.045*lift);
  HAND.style.transform=`translate(${h.x}px,${h.y}px) rotate(${rot+(-17.95)}deg) scale(${sc/1.22})`;
  HAND.style.filter=`drop-shadow(${10+14*lift}px ${16+22*lift}px ${12+10*lift}px rgba(0,20,40,${.30-.08*lift}))`;
  let speed=0;if(lastHand&&h.draw&&lastHand.draw)speed=Math.hypot(h.x-lastHand.x,h.y-lastHand.y);lastHand=h;
  // karaoke subtitles
  let line=null;for(const s of TL.scenes)for(const l of s.subs)if(t>=l.start-.05&&t<l.end)line=l;
  const st=document.getElementById('subtxt');
  if(line){if(st.dataset.v!==line.text){st.dataset.v=line.text;st.innerHTML=line.text.split(' ').map(x=>`<span class="w${/CIR|R&D|30|%|PME|1983|19|000|7|milliards|Leyton/.test(x)?' k':''}">${x.replace('&','&amp;')}</span>`).join(' ')}
    const words=[...st.children];const tot=line.text.length;const p=clamp((t-line.start)/Math.max(.3,line.se-line.start));let acc=0;
    words.forEach(s=>{acc+=s.textContent.length+1;s.classList.toggle('on',(acc-s.textContent.length*.5)/tot<=p+.02)});
    const fi=clamp((t-line.start+.05)/.15);st.parentElement.style.opacity=1;st.style.transform=`translateY(${(1-eout(fi))*14}px)`;st.style.opacity=fi}
  else st.parentElement.style.opacity=0;
  glowFx(t);grain(frame);
  document.getElementById('bug').style.opacity=1-clamp((t-ZT0)/.3);
  const ep=clamp((t-ET0)/.45);const end=document.getElementById('end');end.style.opacity=eout(ep);
  const ring=document.getElementById('ring');if(ring){ring.style.transformBox='fill-box';ring.style.transformOrigin='50% 50%';ring.style.transform=`rotate(${-260*(1-eout(clamp((t-ET0)/1.2)))}deg)`}
  document.getElementById('endlogo').style.transform=`scale(${.88+.12*eout(clamp((t-ET0)/1.1))})`;
  document.getElementById('endrule').style.width=`${280*eout(clamp((t-ET0-.3)/.6))}px`;
  document.getElementById('rays').style.opacity=.9*clamp((t-ET0)/.8);document.getElementById('rays').style.transform=`rotate(${(t-ET0)*6}deg)`;
  document.getElementById('shine').style.left=`${lerp(-300,1100,clamp((t-ET0-.6)/.8))}px`;
  for(const p of endParts){const d=Math.max(0,t-ET0);p.c.setAttribute('cx',p.x+12*Math.sin(d+p.ph));p.c.setAttribute('cy',p.y-p.v*d);p.c.style.opacity=p.o*clamp(d/.6)}
  return {draw:h.draw,speed};
}
window.render=render;init();
</script>
