<!doctype html><html><head><meta charset="utf-8"><title>Gaspard 3D · planches</title>
<style>@font-face{font-family:"Bricolage";src:url(../episodes/ep01-v3/polices/bricolage-grotesque.woff2) format("woff2");font-weight:200 800}
html,body{margin:0;background:#f3ead9}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Planches de contrôle : rendu d'une vue (angle, pose, cadrage) dans une grille. Utilisé par les scripts de vérification.
import * as THREE from 'three';
import { creerGaspard, POSES } from './gaspard3d.js';
await document.fonts.load('800 40px Bricolage').catch(() => {});
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(W, H); r.setClearColor(0xf3ead9); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6b5440, 1.1));
const soleil = new THREE.DirectionalLight(0xffffff, 1.6); soleil.position.set(3, 6, 6); scene.add(soleil);
const g = creerGaspard(THREE); scene.add(g.racine);
const sol = new THREE.Mesh(new THREE.CircleGeometry(2.4, 48), new THREE.MeshBasicMaterial({ color: 0x2a1a10, transparent: true, opacity: .14 })); sol.rotation.x = -Math.PI / 2; sol.position.y = .005; scene.add(sol);
const cam = new THREE.PerspectiveCamera(28, 1, .1, 100);
// vues : [{pose, azimut (deg), hauteur, cible:[x,y,z], distance, titre}]
window.rendreGrille = (vues, cols) => {
  const rows = Math.ceil(vues.length / cols), cw = W / cols, ch = H / rows;
  r.setScissorTest(true); r.clear();
  vues.forEach((v, i) => {
    g.poser(Object.assign({}, POSES[v.pose] || {}, v.p || {}));
    const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch;
    r.setViewport(x, y, cw, ch); r.setScissor(x, y, cw, ch); cam.aspect = cw / ch; cam.updateProjectionMatrix();
    const az = (v.az ?? 20) * Math.PI / 180, el = (v.el ?? 8) * Math.PI / 180, d = v.d ?? 15, c = new THREE.Vector3(...(v.cible || [0, 2.9, 0]));
    cam.position.set(c.x + Math.sin(az) * Math.cos(el) * d, c.y + Math.sin(el) * d, c.z + Math.cos(az) * Math.cos(el) * d); cam.lookAt(c);
    r.render(scene, cam);
  });
  r.setScissorTest(false);
};
window.G = g; window.pret = true;
</script></body></html>
