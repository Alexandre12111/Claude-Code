<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Épisode 1 · Aurea Media</title>
<style>
@font-face{font-family:"Bricolage";src:url(polices/bricolage-grotesque.woff2) format("woff2");font-weight:200 800}
@font-face{font-family:"Geist";src:url(polices/geist.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#000}
#scene{position:relative;width:1080px;height:1920px;overflow:hidden;background:#111}
#svg{position:absolute;inset:0}
#st{position:absolute;left:110px;right:110px;top:1230px;height:260px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 20px;pointer-events:none}
#st .m{font:800 80px/1.08 "Bricolage";letter-spacing:-.01em;color:#fff;display:inline-block;transform-origin:50% 80%;
  text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 2px #000,0 0 22px rgba(0,0,0,.55);-webkit-text-stroke:2px rgba(0,0,0,.35);paint-order:stroke fill}
#st .m.cle{color:#f2c86a;background:linear-gradient(transparent 70%,rgba(242,200,106,.0) 70%)}
#st .m .soul{position:absolute;left:0;right:0;bottom:4px;height:10px;border-radius:6px;background:#f2c86a;transform-origin:0 50%;opacity:.9;box-shadow:0 2px 0 rgba(0,0,0,.4)}
#st .m.cle{position:relative}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.42) 100%)}
#grain{position:absolute;inset:-60px;pointer-events:none;opacity:.075;mix-blend-mode:overlay}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#fondu{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style></head>
<body>
<div id="scene">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs></svg>
  <div id="vignette"></div>
  <canvas id="grain" width="600" height="1080"></canvas>
  <div id="flash"></div>
  <div id="fondu"></div>
  <div id="st"></div>
</div>
<script src="anim.js"></script>
<script src="perso.js"></script>
<script src="decors.js"></script>
<script src="scenes.js"></script>
<script src="sous-titres.js"></script>
<script>
(async () => {
  const script = await (await fetch('script.json')).json();
  let calage = null;
  try { calage = await (await fetch('calage.json', { cache: 'no-store' })).json(); } catch (e) {}
  window.CAL = construireCalage(script, calage);
  construireScenes();
  construireSousTitres(script, window.CAL);
  grainInit();
  window.duree = window.CAL.duree;
  window.pret = true;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) rendre(+q.get('t'));
})();
</script>
</body></html>
