<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Public+Sans:wght@400;600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #041226; }
  .og { position: relative; width: 1200px; height: 630px; color: #fff; font-family: "Public Sans", sans-serif; }
  .og img.fond { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
  .og::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #041226 0%, rgba(4,18,38,.85) 45%, rgba(4,18,38,.2) 100%), linear-gradient(0deg, rgba(4,18,38,.9), transparent 50%); }
  .in { position: absolute; inset: 64px 72px; z-index: 1; display: flex; flex-direction: column; }
  .logo { width: 260px; }
  .sur { margin-top: auto; display: flex; gap: 14px; align-items: center; font: 600 20px Archivo; font-variation-settings: "wdth" 85; letter-spacing: .16em; text-transform: uppercase; color: #E8EFFA; }
  .sur i { width: 6px; height: 6px; background: #DF2229; }
  h1 { margin: 22px 0 0; font: 700 74px/1 Archivo; font-variation-settings: "wdth" 106; letter-spacing: -.02em; max-width: 14ch; }
  h1 em { font-style: normal; color: #49A7FF; }
  .c { position: absolute; width: 26px; height: 26px; border: 0 solid rgba(232,239,250,.6); z-index: 1; }
</style></head>
<body><div class="og">
  <img class="fond" src="../assets/img/hero-poster.webp" alt="">
  <span class="c" style="top:28px;left:28px;border-top-width:1px;border-left-width:1px"></span>
  <span class="c" style="top:28px;right:28px;border-top-width:1px;border-right-width:1px"></span>
  <span class="c" style="bottom:28px;left:28px;border-bottom-width:1px;border-left-width:1px"></span>
  <span class="c" style="bottom:28px;right:28px;border-bottom-width:1px;border-right-width:1px"></span>
  <div class="in">
    <img class="logo" src="../assets/logo-dualtech.webp" alt="">
    <p class="sur">26 novembre 2026<i></i>Campus Cyber<i></i>La Défense</p>
    <h1>Le rendez-vous de <em>l'industrie duale</em></h1>
  </div>
</div></body></html>
